# CrossVideo — Cross‑platform video playback progress synchronization tool
# 2026-10-26 22:34:48 优化部署流程

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: johnpaulreed/crossvideo-postgres:latest
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M # 稍微调大内存限制以满足 rclone 和加密运算
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-crossvideo}
      POSTGRES_USER: ${POSTGRES_USER:-crossvideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      
      # 备份配置项 (自动从根目录 .env 文件读取)
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:-false}
      WEBDAV_URL: ${WEBDAV_URL:-}
      WEBDAV_USER: ${WEBDAV_USER:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      DB_BACKUP_ENCRYPTION_PASSWORD: ${DB_BACKUP_ENCRYPTION_PASSWORD:-}
      WEBDAV_BACKUP_DIR: ${WEBDAV_BACKUP_DIR:-/crossvideo-backups}
      BACKUP_CRON_SCHEDULE: "0 3 * * *"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: johnpaulreed/crossvideo-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CROSSVIDEO_SECRET_KEY: ${CROSSVIDEO_SECRET_KEY:?CROSSVIDEO_SECRET_KEY is required}
      CROSSVIDEO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crossvideo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-crossvideo}
      CROSSVIDEO_REDIS_URL: redis://redis:6379/0
      CROSSVIDEO_ACCESS_TOKEN_EXPIRE_MINUTES: ${CROSSVIDEO_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CROSSVIDEO_CORS_ORIGINS: '["*"]'
      CROSSVIDEO_SENTRY_DSN: ${CROSSVIDEO_SENTRY_DSN:-}
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: johnpaulreed/crossvideo-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: johnpaulreed/crossvideo-caddy:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "443:443"
      - "80:80"
    environment:
      TZ: Asia/Shanghai
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
      CADDY_ENABLE_ACME: "true"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    name: backend_postgres-data
    external: true
  redis-data:
  caddy-data:
  caddy-config:
  uptime-kuma-data: