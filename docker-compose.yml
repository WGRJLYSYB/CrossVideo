# CrossVideo — Cross‑platform video playback progress synchronization tool
# 2026-10-25 14:21:10 调整数据库迁移策略

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-crossvideo}
      POSTGRES_USER: ${POSTGRES_USER:-crossvideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: johnpaulreed/crossvideo-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CROSSVIDEO_SECRET_KEY: ${CROSSVIDEO_SECRET_KEY:?CROSSVIDEO_SECRET_KEY is required}
      CROSSVIDEO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crossvideo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-crossvideo}
      CROSSVIDEO_REDIS_URL: redis://redis:6379/0
      CROSSVIDEO_ACCESS_TOKEN_EXPIRE_MINUTES: ${CROSSVIDEO_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CROSSVIDEO_CORS_ORIGINS: '["*"]'
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: johnpaulreed/crossvideo-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: johnpaulreed/crossvideo-caddy:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "443:443"
      - "80:80"
    environment:
      TZ: Asia/Shanghai
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
      CADDY_ENABLE_ACME: "true"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    name: backend_postgres-data  # 强制指定为原来的旧卷名称，直接复用历史数据！
    external: true
  redis-data:
  caddy-data:
  caddy-config: