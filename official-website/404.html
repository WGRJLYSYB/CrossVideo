<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: #0c0c0c;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.wrap {
    position: relative;
    padding: 48px 36px;
    border: 2px solid #ff9922;
    box-shadow:
        0 0 8px #ff9922,
        0 0 16px #ff6600,
        inset 0 0 12px rgba(255,130,0,0.25);
    animation: arcFlash 1.8s ease-in-out infinite alternate;
    min-width: 380px;
    max-width: 600px;
    text-align: center;
}
@keyframes arcFlash {
    0% {
        box-shadow:
            0 0 6px #ff9922,
            0 0 12px #ff6600,
            inset 0 0 8px rgba(255,130,0,0.2);
        border-color: #ff9922;
    }
    55% {
        box-shadow:
            0 0 14px #ffcc44,
            0 0 28px #ff8800,
            0 0 40px rgba(255, 110, 0, 0.45),
            inset 0 0 18px rgba(255,160,0,0.35);
        border-color: #ffcc44;
    }
    100% {
        box-shadow:
            0 0 7px #ff9922,
            0 0 14px #ff6600,
            inset 0 0 9px rgba(255,130,0,0.22);
        border-color: #ff9922;
    }
}
h1 {
    font-size: 5rem;
    color: #ffb03b;
    text-shadow: 0 0 8px #ff7700, 0 0 16px #ff5500;
    letter-spacing: 4px;
    margin-bottom: 12px;
}
h2 {
    font-size: 22px;
    color: #ffaa33;
    text-shadow: 0 0 6px #ff7700;
    margin-bottom: 24px;
    font-weight: normal;
}
p {
    color: #e2c088;
    line-height: 1.8;
    font-size: 16px;
    opacity: 0.9;
}
.warning-mark {
    font-size: 42px;
    color: #ffcc44;
    text-shadow: 0 0 10px #ff8800;
    margin-bottom: 16px;
}
.sub-note {
    margin-top: 28px;
    font-size: 14px;
    color: #b88844;
    letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="wrap">
    <div class="warning-mark">⚠ 🚧 ⚠</div>
    <h1>404</h1>
    <h2>前方施工 · 禁止通行</h2>
</div>
</body>
</html>
