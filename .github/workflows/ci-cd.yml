name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. 路径检测：精准判断是哪个子目录或 compose 文件发生了修改
  # -------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    outputs:
      compose: ${{ steps.filter.outputs.compose }}
      postgres: ${{ steps.filter.outputs.postgres }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      caddy: ${{ steps.filter.outputs.caddy }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            compose:
              - 'docker-compose.yml'
              - '.env'
            postgres:
              - 'postgres/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            caddy:
              - 'caddy/**'

  # -------------------------------------------------------------
  # 2. 统一前置闸门：
  #    - 总是把根目录 docker-compose.yml 同步到服务器
  #    - 若 compose 有变更，则在此 job 内完成全局 pull + up
  #    其他部署 job 都 needs 它，从而天然等待 compose 应用完毕
  # -------------------------------------------------------------
  deploy-compose:
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Copy root docker-compose.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "${{ secrets.CROSSVIDEO_ROOT_DIR }}"

      - name: Apply Global Compose Changes via SSH
        if: needs.changes.outputs.compose == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.CROSSVIDEO_ROOT_DIR }}
            # 拉取 compose 文件中所有服务（包括新加的公共服务如 Redis、RabbitMQ）的镜像
            docker compose pull
            # 整体应用配置：启动新增服务、更新修改项、清理废弃容器
            docker compose up -d --remove-orphans

  postgres-ci-cd:
    needs: [changes, deploy-compose]
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract short Git SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push postgres image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-postgres:latest
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-postgres:${{ steps.vars.outputs.sha_short }}

      - name: Deploy Postgres via SSH (with retry)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.CROSSVIDEO_ROOT_DIR }}
            
            for i in {1..3}; do
              echo "=== 尝试执行 Postgres 部署 (第 $i 次) ==="
              if docker compose pull postgres && docker compose up -d --no-deps --remove-orphans postgres; then
                echo "=== 部署成功！ ==="
                docker image prune -f || true
                exit 0
              fi
              echo "=== 部署失败，等待 10 秒后重试... ==="
              sleep 10
            done
            
            echo "=== 错误：重试 3 次后依然失败！ ==="
            exit 1

  # -------------------------------------------------------------
  # 3. 后端 CI/CD（依赖 compose 闸门，且仅当 backend 目录改变时运行）
  # -------------------------------------------------------------
  backend-ci-cd:
    needs: [changes, deploy-compose]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract short Git SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-backend:${{ steps.vars.outputs.sha_short }}

      - name: Deploy Backend via SSH (with retry)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.CROSSVIDEO_ROOT_DIR }}
            
            for i in {1..3}; do
              echo "=== 尝试执行 Backend 部署 (第 $i 次) ==="
              if docker compose pull backend && docker compose up -d --no-deps --remove-orphans backend; then
                echo "=== 部署成功！ ==="
                docker image prune -f || true
                exit 0
              fi
              echo "=== 部署失败，等待 10 秒后重试... ==="
              sleep 10
            done
            
            echo "=== 错误：重试 3 次后依然失败！ ==="
            exit 1

  # -------------------------------------------------------------
  # 4. 前端 CI/CD（依赖 compose 闸门，且仅当 frontend 目录改变时运行）
  # -------------------------------------------------------------
  frontend-ci-cd:
    needs: [changes, deploy-compose]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract short Git SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-frontend:${{ steps.vars.outputs.sha_short }}

      - name: Deploy Frontend via SSH (with retry)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.CROSSVIDEO_ROOT_DIR }}
            
            for i in {1..3}; do
              echo "=== 尝试执行 Frontend 部署 (第 $i 次) ==="
              if docker compose pull frontend && docker compose up -d --no-deps --remove-orphans frontend; then
                echo "=== 部署成功！ ==="
                docker image prune -f || true
                exit 0
              fi
              echo "=== 部署失败，等待 10 秒后重试... ==="
              sleep 10
            done
            
            echo "=== 错误：重试 3 次后依然失败！ ==="
            exit 1

  # -------------------------------------------------------------
  # 5. Caddy CI/CD（依赖 compose 闸门，且仅当 caddy 目录改变时运行）
  # -------------------------------------------------------------
  caddy-ci-cd:
    needs: [changes, deploy-compose]
    if: needs.changes.outputs.caddy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract short Git SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push caddy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./caddy
          file: ./caddy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-caddy:latest
            ${{ secrets.DOCKER_USERNAME }}/crossvideo-caddy:${{ steps.vars.outputs.sha_short }}

      - name: Deploy Caddy via SSH (with retry)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.CROSSVIDEO_ROOT_DIR }}
            
            for i in {1..3}; do
              echo "=== 尝试执行 Caddy 部署 (第 $i 次) ==="
              if docker compose pull caddy && docker compose up -d --no-deps --remove-orphans caddy; then
                echo "=== 部署成功！ ==="
                docker image prune -f || true
                exit 0
              fi
              echo "=== 部署失败，等待 10 秒后重试... ==="
              sleep 10
            done
            
            echo "=== 错误：重试 3 次后依然失败！ ==="
            exit 1